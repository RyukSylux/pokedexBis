<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DOOM (1993)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      font-family: monospace;
      color: #fff;
    }
    #canvas {
      display: block;
      width: 100%; height: 100%;
      max-width: 100vw; max-height: 100vh;
      object-fit: contain;
      cursor: crosshair;
      outline: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #ef4444; z-index: 50;
      text-align: center; padding: 20px;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #450a0a;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2 style="font-size: 20px; letter-spacing: 3px; text-transform: uppercase;">Initialisation de DOOM...</h2>
    <p id="status-text" style="color: #9ca3af; font-size: 14px; margin-top: 10px;">Chargement du moteur WebAssembly (60 FPS)...</p>
    <p style="color: #6b7280; font-size: 12px; margin-top: 15px;">Démarrage direct dans E1M1 (aucun mode démo automatique)</p>
  </div>

  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status-text');

    // === GESTION DU CLAVIER AZERTY (ZQSD) & QWERTY (WASD) ===
    // SDL1.2 / Emscripten inspecte les keyCode standards (W=87, A=65, S=83, D=68).
    // Sur clavier AZERTY, l'utilisateur appuie sur Z (90) pour avancer et Q (81) pour aller à gauche.
    // On intercepte en phase de capture (capture: true) avant le chargement d'Emscripten
    // pour convertir automatiquement Z -> W et Q -> A en conservant tous les modificateurs (Shift, Ctrl, etc.).
    const remappedEvents = typeof WeakSet !== 'undefined' ? new WeakSet() : new Set();

    function remapAZERTY(e, eventType) {
      if (remappedEvents.has(e)) return;

      let targetKeyCode = null;
      let targetKey = null;
      let targetCode = null;

      // Touche Z (AZERTY: en haut, W en QWERTY) -> Avancer
      if (e.keyCode === 90 || e.key === 'z' || e.key === 'Z') {
        targetKeyCode = 87; // 'W'
        targetKey = (e.key === 'Z') ? 'W' : 'w';
        targetCode = 'KeyW';
      }
      // Touche Q (AZERTY: à gauche de S, A en QWERTY) -> Pas latéral gauche
      else if (e.keyCode === 81 || e.key === 'q' || e.key === 'Q') {
        targetKeyCode = 65; // 'A'
        targetKey = (e.key === 'Q') ? 'A' : 'a';
        targetCode = 'KeyA';
      }

      if (targetKeyCode !== null) {
        e.stopImmediatePropagation();
        e.preventDefault();

        const cloned = new KeyboardEvent(eventType, {
          key: targetKey,
          code: targetCode,
          location: e.location,
          ctrlKey: e.ctrlKey,
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          metaKey: e.metaKey,
          repeat: e.repeat,
          bubbles: true,
          cancelable: true,
          composed: true,
          view: window
        });

        // Définition explicite pour compatibilité maximale avec Emscripten / SDL
        Object.defineProperty(cloned, 'keyCode', { value: targetKeyCode, enumerable: true });
        Object.defineProperty(cloned, 'which', { value: targetKeyCode, enumerable: true });
        Object.defineProperty(cloned, 'charCode', { value: targetKeyCode, enumerable: true });
        Object.defineProperty(cloned, 'key', { value: targetKey, enumerable: true });
        Object.defineProperty(cloned, 'code', { value: targetCode, enumerable: true });

        remappedEvents.add(cloned);
        (e.target || canvas || window).dispatchEvent(cloned);
      }
    }

    ['keydown', 'keyup', 'keypress'].forEach(function(evt) {
      window.addEventListener(evt, function(e) { remapAZERTY(e, evt); }, true);
      document.addEventListener(evt, function(e) { remapAZERTY(e, evt); }, true);
      if (canvas) {
        canvas.addEventListener(evt, function(e) { remapAZERTY(e, evt); }, true);
      }
    });

    const BASE_URL = 'https://raz0red.github.io/webprboom/doom1/';

    window.Module = {
      canvas: canvas,
      // Démarrage direct dans E1M1 avec la difficulté 'Hurt Me Plenty' (skill 3)
      // Cela désactive totalement l'attract loop / mode démo automatique : le joueur est directement aux commandes !
      arguments: ['-warp', '1', '1', '-skill', '3'],
      elementPointerLock: true,
      locateFile: function(path) {
        return BASE_URL + path;
      },
      onRuntimeInitialized: function() {
        setTimeout(function() {
          if (window.SDL && window.SDL.audioContext) {
            const resumeAudio = function() {
              if (window.SDL.audioContext.state !== 'running') {
                window.SDL.audioContext.resume();
              }
            };
            document.addEventListener('click', resumeAudio);
            document.addEventListener('keydown', resumeAudio);
            document.addEventListener('touchstart', resumeAudio);
          }
          loading.style.display = 'none';
          canvas.focus();
        }, 150);
      },
      setStatus: function(text) {
        if (!text) return;
        const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (match) {
          const percent = Math.round((match[2] / match[4]) * 100);
          statusText.innerText = 'Téléchargement des données... ' + percent + '%';
        } else {
          statusText.innerText = text;
        }
      }
    };

    // Auto-focus dès le clic
    window.addEventListener('click', function() { canvas.focus(); });
    window.addEventListener('load', function() { canvas.focus(); });
  </script>
  <script src="https://raz0red.github.io/webprboom/doom1/doom1.js"></script>
</body>
</html>
